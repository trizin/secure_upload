[pytest]
# /tmp on this host is a 484MB RAM-backed tmpfs, and these tests shuttle raw
# RGBA buffers (a 1400x1000 image is 5.6MB a time) between Python and node.
# Left on the default, a full run fills tmpfs and fails with ENOSPC while df
# still shows the disk nearly empty. Keep temp files on real disk.
# (basetemp is a command-line option, not an ini key - it only works here.)
addopts = --basetemp=.pytest-tmp
testpaths = tests
